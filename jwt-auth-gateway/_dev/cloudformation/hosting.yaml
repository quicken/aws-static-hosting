AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Private static hosting for single page apps (e.g. a Trailhead shell and its apps): a private S3
  bucket behind CloudFront, gated by a Cognito login at the edge. Deploy to us-east-1, where
  Lambda@Edge functions must live. Provisioned ONCE by _dev/scripts/provision.sh (the function
  shells ship with stubs); real function code is rolled out separately by _dev/scripts/deploy-code.sh,
  so this stack is never touched by a code deploy. See _docs/DEPLOYMENT.md for the full sequence.

# Behaviour routing (most specific first):
#   /_auth/*        auth-routes  Lambda@Edge, viewer-request          sign-in, callback, refresh, sign-out
#   {ApiPrefix}/*   check-auth   CloudFront Function, viewer-request  cookie → Bearer to the API (optional)
#   default         check-auth   CloudFront Function, viewer-request  login gate + deep links → cached S3
#
# The gate runs on every request, so it is a CloudFront Function: sub-millisecond, at every edge
# location, no cold starts, a fraction of Lambda@Edge's price. It can't verify RSA signatures, so
# it checks an HMAC stamp that auth-routes sets after fully verifying the Cognito token. Lambda@Edge
# only runs for the rare /_auth/* requests.
#
# Nothing forwards the viewer's cookies or Host header to S3. Both functions run at viewer-request,
# where they see both, so the S3 behaviours need no origin request policy, and Origin Access
# Control signing works without special handling.

Parameters:
  DomainName:
    Type: String
    Default: ""
    Description: Optional custom domain, e.g. apps.example.com. Leave empty to use the CloudFront domain.
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate in us-east-1 covering DomainName. Required when DomainName is set.
  ApiOriginDomain:
    Type: String
    Default: ""
    Description: Optional API origin host (e.g. abc123.execute-api.ap-southeast-2.amazonaws.com) served under ApiPrefix.
  ApiPrefix:
    Type: String
    Default: /api
    AllowedPattern: ^/[A-Za-z0-9_-]+$
    Description: Same-origin API prefix. Must match API_PREFIX used when building the functions.
  PriceClass:
    Type: String
    Default: PriceClass_All
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]

Rules:
  CustomDomainNeedsCertificate:
    RuleCondition: !Not [!Equals [!Ref DomainName, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref CertificateArn, ""]]
        AssertDescription: CertificateArn (an ACM certificate in us-east-1) is required when DomainName is set.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasApiOrigin: !Not [!Equals [!Ref ApiOriginDomain, ""]]

Mappings:
  # AWS managed policy ids.
  Policies:
    Cache:
      CachingOptimized: 658327ea-f89d-4fab-a63d-7e88639e58f6
      CachingDisabled: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
    OriginRequest:
      # API Gateway rejects a forwarded viewer Host header; this forwards everything else.
      AllViewerExceptHostHeader: b689b0a8-53d0-40ab-baf2-68738e2966ac

Resources:
  # ---------------------------------------------------------------------------
  # Origin: private bucket, readable only by this distribution.
  # ---------------------------------------------------------------------------
  OriginBucket:
    Type: AWS::S3::Bucket
    # Private origin: the ONLY way in is CloudFront with a signed OAC request (policy below). The
    # four public-access blocks + BucketOwnerEnforced mean nothing can make an object public, even
    # by accident — the login gate is the only front door.
    # DEMO: retained on purpose so a stack delete can't wipe uploaded content. For a throwaway demo
    # you may prefer this deletable; for anything real keep Retain so content and the bucket name
    # (globally unique, slow to free) survive a stack replace.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Lets CloudFront sign its S3 reads with SigV4 so the bucket can stay fully private — the modern
  # replacement for Origin Access Identity, and required for SSE and newer regions.
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  OriginBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OriginBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${OriginBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
      # Deliberately no s3:ListBucket. A missing object is a 403 rather than a 404, but a
      # request for the bucket root can never return a listing of every key.

  # ---------------------------------------------------------------------------
  # Edge functions — PROVISIONED here, CODE DEPLOYED by deploy-code.sh.
  #
  # This stack is deployed ONCE. It creates the function shells (roles, config) but does NOT
  # own their code or the Lambda@Edge version association, because those change on every code
  # deploy and we want the stack to stay untouched between provisions:
  #
  #   - CloudFront Function (gate): stable ARN; deploy-code.sh updates its code in place.
  #   - Lambda@Edge (auth-routes): CloudFront needs a NUMBERED version ARN, which changes with
  #     every publish. deploy-code.sh publishes the version AND repoints the distribution's
  #     association via the AWS API. So the /_auth/* behaviour below ships with NO Lambda
  #     association — the script attaches it. Until the first deploy-code.sh run, /_auth/* has
  #     no handler and returns 403 from S3; that is expected on a freshly-provisioned stack.
  #
  # This is also the Terraform-friendly shape: the association lives outside the provisioning
  # IaC (the `ignore_changes = [lambda_function_association]` pattern), so a port carries over
  # without the versioned-ARN churn that forced a stack update per deploy.
  # ---------------------------------------------------------------------------
  # Execution role for auth-routes. Trusts BOTH lambda and edgelambda: a Lambda@Edge function is
  # created as a normal Lambda (lambda.amazonaws.com) but invoked at the edge by CloudFront
  # (edgelambda.amazonaws.com), so both principals must be allowed to assume it. Basic-execution
  # only — the function needs nothing beyond CloudWatch Logs.
  EdgeFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com, edgelambda.amazonaws.com]
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  AuthRoutesFunction:
    Type: AWS::Lambda::Function
    # Provisioned once with a bootstrap stub. deploy-code.sh pushes the real bundle with
    # update-function-code, publishes a version, and associates it with the distribution.
    # The stack never sees the real code or the version, so it does not change per deploy.
    Properties:
      Description: Viewer-request /_auth/* endpoints (sign-in, callback, refresh, sign-out).
      Runtime: nodejs24.x
      Handler: auth-routes.handler
      Code:
        ZipFile: "export const handler = async () => ({ status: '503', statusDescription: 'Not deployed' });"
      Role: !GetAtt EdgeFunctionRole.Arn
      MemorySize: 128
      Timeout: 5

  # The per-request gate. deploy-code.sh updates its code in place (stable ARN, no stack churn).
  # Provisioned with a minimal pass-through stub so the resource and its distribution
  # association are valid before the first code deploy.
  CheckAuthFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-check-auth
      AutoPublish: true
      FunctionConfig:
        Comment: Viewer-request login gate and deep-link rewrite.
        Runtime: cloudfront-js-2.0
      FunctionCode: "function handler(event) { return event.request; }"

  # ---------------------------------------------------------------------------
  # Distribution
  # ---------------------------------------------------------------------------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} - static apps behind a Cognito login at the edge
        # Maps a request for "/" to "/index.html" at the CloudFront level (S3 behind OAC has no
        # directory index of its own). Only the distribution root — subfolder indexes under /app
        # are resolved by the gate's deep-link rewrite instead.
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: s3
            DomainName: !GetAtt OriginBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              # Empty string is required: it tells CloudFront this origin uses OAC (above), not the
              # legacy Origin Access Identity. A non-empty value here would select the old mechanism.
              OriginAccessIdentity: ""
          - !If
            - HasApiOrigin
            - Id: api
              DomainName: !Ref ApiOriginDomain
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
            - !Ref AWS::NoValue

        # Static app content. Cached, because the gate runs at viewer-request on every request,
        # cache hits included. Everything served here must be identical for every signed-in
        # user; give per-user content its own uncached behaviour.
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !FindInMap [Policies, Cache, CachingOptimized]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CheckAuthFunction.FunctionARN

        CacheBehaviors:
          # Truly-public static assets (CSS, images, JS). NO function association at all: the gate
          # never runs here, so these are served to anyone with zero per-request cost — the same
          # "no Lambda on this path" idea as the API behaviour, but for public files. Cached hard
          # (CachingOptimized), because public assets are identical for every viewer. Only HTML
          # PAGES need the gate (auth + deep-link rewrite); assets never do, so they live here and
          # pages live under the default/app behaviour. Put nothing private under /public/*.
          - PathPattern: /public/*
            TargetOriginId: s3
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !FindInMap [Policies, Cache, CachingOptimized]

          # Auth endpoints answer from the edge and never reach S3. Never cached: every response
          # sets or clears cookies. POST is allowed for /_auth/refresh.
          #
          # NOTE: no LambdaFunctionAssociations here on purpose. deploy-code.sh attaches the
          # auth-routes version (and repoints it on every deploy) via the AWS API, so this
          # behaviour and its versioned-ARN churn stay out of the provisioning stack. Before the
          # first deploy-code.sh run this path has no handler and returns 403 from S3.
          - PathPattern: /_auth/*
            TargetOriginId: s3
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !FindInMap [Policies, Cache, CachingDisabled]

          # Same-origin API: no CORS. Never cached, because responses are per-user.
          - !If
            - HasApiOrigin
            - PathPattern: !Sub ${ApiPrefix}/*
              TargetOriginId: api
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachedMethods: [GET, HEAD]
              CachePolicyId: !FindInMap [Policies, Cache, CachingDisabled]
              OriginRequestPolicyId: !FindInMap [Policies, OriginRequest, AllViewerExceptHostHeader]
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt CheckAuthFunction.FunctionARN
            - !Ref AWS::NoValue

Outputs:
  BucketName:
    Description: Upload your built apps here.
    Value: !Ref OriginBucket
  DistributionId:
    Value: !Ref Distribution
  AuthRoutesFunctionName:
    Description: Lambda@Edge function deploy-code.sh pushes code to and versions.
    Value: !Ref AuthRoutesFunction
  CheckAuthFunctionName:
    Description: CloudFront Function deploy-code.sh updates in place.
    Value: !Sub ${AWS::StackName}-check-auth
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  SiteUrl:
    Value: !If [HasCustomDomain, !Sub "https://${DomainName}/", !Sub "https://${Distribution.DomainName}/"]
  CallbackUrl:
    Description: Register this (and LogoutUrl) on the Cognito app client.
    Value: !If [HasCustomDomain, !Sub "https://${DomainName}/_auth/callback", !Sub "https://${Distribution.DomainName}/_auth/callback"]
  LogoutUrl:
    Value: !If [HasCustomDomain, !Sub "https://${DomainName}/", !Sub "https://${Distribution.DomainName}/"]
